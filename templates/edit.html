<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar: {{ post.title }} - Blog de Laura</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #333; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        h1 { color: #111; }
        .form-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07); margin-top: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; color: #1e293b; }
        input[type="text"], textarea { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        input[type="text"]:focus, textarea:focus { outline: 3px solid rgba(14, 165, 233, 0.18); border-color: #0284c7; }
        textarea { min-height: 240px; resize: vertical; line-height: 1.6; }
        .post-images { display: flex; flex-wrap: wrap; gap: 16px; }
        .post-image { width: 180px; }
        .post-image img { display: block; width: 100%; height: 130px; object-fit: cover; border-radius: 6px; }
        .post-image label { font-weight: 400; }
        button { background: #0070f3; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 15px; }
        button:hover { background: #0051cb; }
        .btn-cancel { display: block; text-align: center; color: #777; text-decoration: none; font-size: 15px; }
        .btn-cancel:hover { text-decoration: underline; }
        @media (max-width: 700px) {
            body { padding: 20px 12px; }
            .form-box { padding: 18px; }
        }
    </style>
</head>
<body>

    <h1>✏️ Editar artículo</h1>

    <div class="form-box">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="title">Título</label>
                <!-- Usamos 'value' para cargar el título actual -->
                <input type="text" id="title" name="title" value="{{ post.title }}" required>
            </div>
            <div class="form-group">
                <label for="content">Contenido</label>
                <textarea id="content" name="content" rows="10" required placeholder="Escribe el contenido del artículo aquí...">{{ post.content }}</textarea>
            </div>
            <div class="form-group">
                <label for="images">Añadir imágenes (opcional)</label>
                <input type="file" id="images" name="images" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
                <small>Hasta 5 imágenes nuevas por envío; JPG, PNG, GIF o WebP, máximo 5 MB cada una.</small>
            </div>
            {% if post.images %}
                <div class="form-group">
                    <label>Imágenes actuales (marca las que quieras eliminar)</label>
                    <div class="post-images">
                        {% for image in post.images %}
                            <div class="post-image">
                                <img src="{{ url_for('static', filename='uploads/' ~ image.filename) }}" alt="Imagen del artículo">
                                <label><input type="checkbox" name="delete_images" value="{{ image.id }}"> Eliminar</label>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
            <button type="submit">Guardar cambios</button>
            <a href="{{ url_for('post_detail', post_id=post.id) }}" class="btn-cancel">Cancelar y volver atrás</a>
        </form>
    </div>

</body>
</html>
